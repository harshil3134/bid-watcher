name: Watch bids

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min (GitHub may start it a few minutes late)
  workflow_dispatch:         # "Run workflow" button for testing
  push:
    paths: ["lots.txt"]      # added/removed a listing -> check right away

permissions:
  contents: write            # to commit state.json (last seen bids)

concurrency:
  group: watch-bids
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check lots
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python watch.py

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "bid-watcher"
            git config user.email "bid-watcher@users.noreply.github.com"
            git add state.json
            git commit -m "Update bid state"
            git pull --rebase
            git push
          fi
